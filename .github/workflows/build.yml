name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|What went wrong|FAILURE" -A4 build.log | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk kindle-cover.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kindle-cover
          path: kindle-cover.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: "Built from ${{ github.sha }}"
          files: kindle-cover.apk
          make_latest: "true"
